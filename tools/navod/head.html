<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>Brány Skeldalu (návod)</title>
<style>
@font-face{font-family:Alm;src:url(fonts/Almendra-Regular.ttf);font-weight:400}
@font-face{font-family:Alm;src:url(fonts/Almendra-Bold.ttf);font-weight:700}
@font-face{font-family:Alm;src:url(fonts/Almendra-Italic.ttf);font-style:italic}
@page{size:A4;margin:12mm 10mm 12mm 10mm;background:#2A2927}
html,body{background:#2A2927;color:#E9DCAE;margin:0}
body{font-family:Alm,"DejaVu Sans",serif;font-size:7.6pt;line-height:1.33}
h1{text-align:center;font-size:14pt;margin:2pt 0 10pt}
h2{font-size:9pt;margin:10pt 0 4pt;letter-spacing:.2pt;break-after:avoid}
h3{font-size:8pt;margin:6pt 0 2pt;break-after:avoid}
p{margin:0 0 4pt;text-align:justify}
b{font-weight:700}
ul{margin:0 0 4pt 12pt;padding:0}
li{margin:0 0 1pt}
.ind{margin-left:12pt}
.st{margin:0 0 0 10pt}
.cols{column-count:2;column-gap:16pt}
.cols h3{break-after:avoid}
.spell{break-inside:avoid;margin-bottom:5pt}
.spell p{margin:0 0 1pt;text-align:left}
.ex{font-style:italic}
table{border-collapse:collapse;width:100%;margin:2pt 0 6pt;font-size:7.4pt}
th,td{border:0.5pt solid #6d6553;padding:1.5pt 4pt;text-align:left;vertical-align:top}
th{color:#2A2927;background:#E9DCAE;font-weight:700}
.two{display:flex;gap:12pt}.two>div{flex:1}
.pb{break-before:page}
.note{border:0.6pt solid #8a7f63;padding:4pt 6pt;margin:4pt 0 6pt}
.sym{font-family:"DejaVu Sans",sans-serif;font-size:7pt}
ol{margin:0 0 4pt 14pt;padding:0}ol li{margin-bottom:2.5pt;text-align:justify}
.src{text-align:right;font-style:italic;margin-top:8pt}
</style></head><body>
<style>
figure{margin:4pt 0 6pt;text-align:center;break-inside:avoid}
figure img{max-width:100%;height:auto;border:0.6pt solid #6d6553}
.pair{justify-content:center;align-items:flex-start}.pair figure{flex:0 1 auto}
.ph{border:0.8pt dashed #8a7f63;padding:18pt 6pt;color:#bfb59a;text-align:center;margin:4pt 0}
.pair{display:flex;gap:6pt;break-inside:avoid}.pair figure{flex:1}
.cred{text-align:center;margin:-4pt 0 10pt;font-size:7.4pt}
.and{border:0.6pt solid #8a7f63;padding:3pt 6pt;margin:3pt 0 5pt;font-size:7.3pt}
.and b:first-child{color:#f3e6b8}
.best p{margin-bottom:3pt}
</style>
