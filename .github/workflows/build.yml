# CI: Linux desktop build + Android debug build. Needs no original game data.
name: build

on:
  push:
  pull_request:

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev cmake ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DACHIEVEMENTS_BACKEND=none
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: skeldal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
