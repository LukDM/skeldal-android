# CI: Linux desktop build + Android debug build. Needs no original game data.
name: build

on:
  push:
  pull_request:

jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev cmake ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DACHIEVEMENTS_BACKEND=none
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # the runner image already has the Android SDK ($ANDROID_HOME); only NDK and CMake are added
      - name: Install NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests and debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: skeldal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
